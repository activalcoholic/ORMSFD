# ORMSFD with a shared image-predicted overlap prior and sequential feature enhancement.
# New MSFEM instances use half-channel identity / prior-convolution fusion.
# Enhanced P3/P4 features feed BOTH Detect and the next downsampling/fusion stage.
# train.py uses this original-YOLO11 -> custom-neck mapping for COCO initialization.
# The Detect layer is mapped separately to the final layer of this model.
pretrained_layer_map:
  17: 19
  18: 20
  19: 21
  20: 23
  21: 24
  22: 25

nc: 1
scale: n

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# GT overlap maps supervise the predicted prior only during training.
overlap_prior:
  sigma: 8.0
  loss: bce
  weight: 1.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-backbone P3/8
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6-backbone P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 2, C2PSA, [1024]]             # 10-backbone P5/32

head:
  # Original top-down fusion: P5 -> P4 -> P3.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, False]]                # 13-top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15-use stride-8 backbone P3
  - [-1, 2, C3k2, [256, False]]                # 16-fused P3 before enhancement

  # Predict a shared prior from P3 BEFORE enhancement to avoid a dependency cycle.
  # args: [hidden_channels, initial_probability]. Sigmoid is inside MSFEM.
  - [16, 1, OverlapPriorHead, [16, 0.05]]        # 17-shared P3 prior logits
  - [[16, 17], 1, MSFEM, [1]]              # 18-enhanced P3 -> Detect and layer 19

  # Bottom-up fusion now consumes the enhanced P3, rather than raw layer 16.
  - [18, 1, Conv, [256, 3, 2]]                  # 19-downsample enhanced P3
  - [[-1, 13], 1, Concat, [1]]                  # 20-fuse with top-down P4
  - [-1, 2, C3k2, [512, False]]                 # 21-fused P4
  - [[21, 17], 1, MSFEM, [2]]              # 22-enhanced P4 -> Detect and layer 23

  # Continue bottom-up fusion using the enhanced P4.
  - [22, 1, Conv, [512, 3, 2]]                  # 23-downsample enhanced P4
  - [[-1, 10], 1, Concat, [1]]                  # 24-fuse with backbone P5
  - [-1, 2, C3k2, [1024, True]]                 # 25-fused P5
  - [[25, 17], 1, MSFEM, [4]]              # 26-enhanced P5

  - [[18, 22, 26], 1, Detect, [nc]]             # 27-Detect(enhanced P3/P4/P5)
